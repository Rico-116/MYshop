basePath: /api
definitions:
  controller.AdminLoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  models.AddAddressRequest:
    properties:
      city:
        type: string
      detail_address:
        type: string
      district:
        type: string
      is_default:
        type: integer
      province:
        type: string
      receiver_name:
        type: string
      receiver_phone:
        type: string
    type: object
  models.AddCartRequest:
    properties:
      quantity:
        type: integer
      sku_id:
        type: integer
    required:
    - quantity
    - sku_id
    type: object
  models.AdminCancelOrderRequest:
    properties:
      order_no:
        type: string
    required:
    - order_no
    type: object
  models.AdminCreateCategoryRequest:
    properties:
      icon:
        type: string
      name:
        type: string
      parent_id:
        type: integer
      sort:
        type: integer
      status:
        type: integer
    required:
    - name
    type: object
  models.AdminCreateProductRequest:
    properties:
      category_id:
        type: integer
      description:
        type: string
      main_image:
        type: string
      name:
        type: string
      status:
        type: integer
      subtitle:
        type: string
    required:
    - category_id
    - name
    type: object
  models.AdminCreateSeckillActivityRequest:
    properties:
      end_time:
        type: string
      product_id:
        type: integer
      seckill_price:
        type: number
      sku_id:
        type: integer
      start_time:
        type: string
      stock:
        type: integer
    required:
    - end_time
    - product_id
    - seckill_price
    - sku_id
    - start_time
    - stock
    type: object
  models.AdminCreateSkuRequest:
    properties:
      image:
        type: string
      price:
        type: number
      product_id:
        type: integer
      sku_code:
        type: string
      sku_name:
        type: string
      status:
        type: integer
      stock:
        type: integer
    required:
    - product_id
    - sku_code
    - sku_name
    type: object
  models.AdminShipOrderRequest:
    properties:
      order_no:
        type: string
    required:
    - order_no
    type: object
  models.AdminUpdateCategoryRequest:
    properties:
      icon:
        type: string
      name:
        type: string
      parent_id:
        type: integer
      sort:
        type: integer
      status:
        type: integer
    type: object
  models.AdminUpdateProductRequest:
    properties:
      category_id:
        type: integer
      description:
        type: string
      main_image:
        type: string
      name:
        type: string
      status:
        type: integer
      subtitle:
        type: string
    type: object
  models.AdminUpdateSeckillActivityRequest:
    properties:
      end_time:
        type: string
      id:
        type: integer
      seckill_price:
        type: number
      start_time:
        type: string
      status:
        type: integer
      stock:
        type: integer
    required:
    - end_time
    - id
    - seckill_price
    - start_time
    - status
    - stock
    type: object
  models.AdminUpdateSkuRequest:
    properties:
      image:
        type: string
      price:
        type: number
      sku_code:
        type: string
      sku_name:
        type: string
      status:
        type: integer
      stock:
        type: integer
    type: object
  models.AdminUpdateUserStatusRequest:
    properties:
      status:
        type: integer
      user_id:
        type: integer
    required:
    - user_id
    type: object
  models.CancelOrderRequest:
    properties:
      order_no:
        type: string
    required:
    - order_no
    type: object
  models.ConfirmReceiveRequest:
    properties:
      order_no:
        type: string
    required:
    - order_no
    type: object
  models.CreateOrderRequest:
    properties:
      address_id:
        type: integer
      cart_ids:
        description: 购物车下单
        items:
          type: integer
        type: array
      quantity:
        type: integer
      remark:
        type: string
      sku_id:
        description: 直接购买
        type: integer
      source_type:
        description: cart / direct
        type: string
    type: object
  models.CreateProductCommentRequest:
    properties:
      content:
        type: string
      order_no:
        type: string
      parent_id:
        type: integer
      product_id:
        type: integer
      rating:
        type: integer
      sku_id:
        type: integer
    required:
    - content
    - product_id
    type: object
  models.DeleteCartRequest:
    properties:
      cart_id:
        type: integer
    required:
    - cart_id
    type: object
  models.EmailLoginRequest:
    properties:
      code:
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
  models.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  models.OrderPreviewRequest:
    properties:
      cart_ids:
        items:
          type: integer
        type: array
      quantity:
        type: integer
      sku_id:
        type: integer
      source_type:
        type: string
    type: object
  models.PayOrderRequest:
    properties:
      order_no:
        type: string
    type: object
  models.RegisterRequest:
    properties:
      avatar:
        type: string
      code:
        type: string
      confirm:
        type: string
      email:
        type: string
      id:
        type: string
      nickname:
        type: string
      password:
        type: string
      phone:
        type: string
      username:
        type: string
    type: object
  models.ResetPasswordRequest:
    properties:
      code:
        type: string
      confirm_password:
        type: string
      email:
        type: string
      new_password:
        type: string
    type: object
  models.SeckillSubmitRequest:
    properties:
      activity_id:
        type: string
      address_id:
        type: string
    required:
    - activity_id
    - address_id
    type: object
  models.SendLoginCodeRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  models.SendRegisterCodeRequest:
    properties:
      email:
        type: string
    type: object
  models.SendResetPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  models.UpdateAddressRequest:
    properties:
      city:
        type: string
      detail_address:
        type: string
      district:
        type: string
      id:
        type: integer
      is_default:
        type: integer
      province:
        type: string
      receiver_name:
        type: string
      receiver_phone:
        type: string
    type: object
  models.UpdateCartCheckRequest:
    properties:
      cart_id:
        type: integer
      cart_ids:
        items:
          type: integer
        type: array
      checked:
        type: integer
    required:
    - checked
    type: object
  models.UpdateCartQuantityRequest:
    properties:
      cart_id:
        type: integer
      quantity:
        type: integer
    required:
    - cart_id
    - quantity
    type: object
  models.UpdateUserProfileRequest:
    properties:
      avatar:
        type: string
      email:
        type: string
      gender:
        type: string
      nickname:
        type: string
    type: object
  util.Response:
    properties:
      code:
        type: integer
      data: {}
      msg:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: 基于 Go + Gin + MySQL + Redis + RabbitMQ 的商城项目接口文档
  title: MYshop 商城系统接口文档
